on:
  repository_dispatch:
  workflow_dispatch:
    inputs:
      ssh:
        description: '立即构建'
        required: true
        default: 'true'
name: RUN BUILD
env:
  RELEASE_PATH: ${{ github.workspace }}
  RESOLVE_VERSION: "19.0.3"
jobs:
  flatpak:
    name: "Flatpak"
    runs-on: ubuntu-latest
    container:
      image: bilelmoussaoui/flatpak-github-actions:freedesktop-24.08
      options: --privileged
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Build Flatpak
      uses: flatpak/flatpak-github-actions/flatpak-builder@v6
      with:
        bundle: com.jcleng.Resolve.flatpak
        manifest-path: com.jcleng.Resolve.yaml
        cache-key: flatpak-builder-resolve
        repository-name: flathub
        branch: stable

    - name: Generate release notes
      run: |
        DATE=$(date +%Y%m%d)
        echo "TAG=v${{ env.RESOLVE_VERSION }}-${DATE}" >> "$GITHUB_ENV"
        cat > release.txt <<'EOF'
        # DaVinci Resolve Flatpak (com.jcleng.Resolve)

        由 GitHub Actions 自动构建的 DaVinci Resolve Flatpak 包。

        ## 安装方法

        ```bash
        # 下载 com.jcleng.Resolve.flatpak 后：
        flatpak install --user com.jcleng.Resolve.flatpak
        flatpak run com.jcleng.Resolve
        ```

        ## 说明

        - 应用 ID: com.jcleng.Resolve
        - 基于 DaVinci Resolve 19.0.3 官方安装包构建
        - 运行时: org.kde.Platform / io.qt.PySide.BaseApp 6.11
        EOF

    - name: Release
      uses: softprops/action-gh-release@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: ${{ env.TAG }}
        name: DaVinci Resolve ${{ env.RESOLVE_VERSION }} (${{ env.TAG }})
        body_path: ${{ env.RELEASE_PATH }}/release.txt
        files: |
          ${{ env.RELEASE_PATH }}/com.jcleng.Resolve.flatpak
        overwrite: true
