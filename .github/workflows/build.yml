on:
  repository_dispatch:
  workflow_dispatch:
    inputs:
      ssh:
        description: '立即构建'
        required: true
        default: 'true'
name: RUN BUILD
jobs:
  flatpak:
    name: "Flatpak"
    runs-on: ubuntu-latest
    container:
      image: bilelmoussaoui/flatpak-github-actions:freedesktop-24.08
      options: --privileged
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Build Flatpak
      uses: flatpak/flatpak-github-actions/flatpak-builder@v6
      with:
        bundle: com.jcleng.Resolve.flatpak
        manifest-path: com.jcleng.Resolve.yaml
        cache-key: flatpak-builder-resolve
        repository-name: flathub
        branch: stable

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: com.jcleng.Resolve.flatpak
        path: com.jcleng.Resolve.flatpak
        compression-level: 0
        if-no-files-found: error
